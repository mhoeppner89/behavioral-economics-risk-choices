<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choices under uncertainty</title>
<style>
:root{font-family:Arial,sans-serif;color:#18232c;background:#f4f7f8;font-size:16px}*{box-sizing:border-box}body{margin:0}header{height:5px;background:linear-gradient(90deg,#00afd3 0 72%,#111 72% 82%,#e3e6e5 82%)}main{max-width:760px;margin:auto;padding:clamp(22px,5vw,44px) 18px 60px}.brand{font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;color:#50717c;font-weight:700}h1{font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1;letter-spacing:-.035em;margin:.65em 0 .3em}h2{font-size:1.4rem;line-height:1.2;margin:0 0 16px}p{line-height:1.55}.sub{color:#53646c;margin:0 0 26px}.progress-top{display:flex;justify-content:space-between;font-size:.83rem;font-weight:700;color:#50666e;margin:0 0 8px}.track{height:5px;border-radius:5px;background:#dbe6e8;margin-bottom:25px}.track span{display:block;background:#00a6c7;height:100%;border-radius:5px;transition:width .2s}.card{background:#fff;border:1px solid #dae5e7;border-radius:14px;padding:clamp(21px,5vw,36px);box-shadow:0 10px 32px #1b47520a}.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:#0088a4;text-transform:uppercase;margin:0 0 10px}.lead{font-size:1.06rem;margin:0 0 20px}.context{border-left:3px solid #00afd3;background:#f0f8fa;padding:10px 15px;margin:0 0 22px}.context p{margin:3px 0}fieldset{border:0;margin:0 0 20px;padding:0}legend{font-weight:700;line-height:1.4;margin-bottom:12px}.choice{position:relative;display:flex;gap:12px;align-items:flex-start;border:1px solid #cddde1;border-radius:9px;padding:15px;margin:9px 0;cursor:pointer;line-height:1.45}.choice:has(input:checked){border-color:#008fae;background:#eaf8fb;box-shadow:0 0 0 1px #008fae}.choice input{accent-color:#008fae;flex:none;width:19px;height:19px;margin:2px 0}.choice strong{display:block;margin-bottom:2px}.money{display:flex;align-items:center;gap:9px;max-width:250px}.money span{font-size:1.2rem;font-weight:bold}.money input{width:100%;padding:13px;border:1px solid #abc0c5;border-radius:7px;font:inherit;font-size:1.1rem}input:focus-visible,button:focus-visible{outline:3px solid #76d8eb;outline-offset:2px}.help{font-size:.87rem;color:#5e7076;margin:6px 0 0}.actions{display:flex;gap:10px;align-items:center;margin-top:26px}.button{border:0;border-radius:8px;background:#008eac;color:#fff;font:inherit;font-weight:700;padding:13px 23px;cursor:pointer}.button:hover{background:#007c96}.secondary{color:#31515a;background:#e9f1f3}.secondary:hover{background:#d9e9ec}.error{color:#a32929;font-size:.9rem;margin:12px 0 0;min-height:1em}.hidden{display:none!important}table{width:100%;border-collapse:collapse;margin:15px 0}th,td{text-align:center;padding:12px 6px;border-bottom:1px solid #dce7e9}th:first-child,td:first-child{text-align:left}.done-mark{font-size:2.2rem;color:#008eac}.status{padding:12px 14px;background:#f1f7f8;border-radius:7px;color:#35535c}.retry{margin-top:8px}.done-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}@media(max-width:480px){main{padding:24px 14px 45px}.card{padding:21px 18px}.actions .button{flex:1}.choice{padding:13px}.money{max-width:100%}}
</style>
</head>
<body><header></header><main>
<div class="brand">Behavioral Economics · BTU</div><h1>Choices under uncertainty</h1>
<p class="sub">Choose what you prefer. All amounts are hypothetical.</p>
<div id="work"><div class="progress-top"><span id="progress-text"></span><span id="progress-number"></span></div><div class="track" aria-hidden="true"><span id="progress-bar"></span></div><form id="form" novalidate><div class="card" id="content"></div><p class="error" id="error" role="alert"></p><div class="actions"><button type="button" class="button secondary" id="back">Back</button><button type="submit" class="button" id="next">Continue</button></div></form></div>
<section id="done" class="card hidden"><div class="done-mark">✓</div><h2>Thank you.</h2><p>Your choices are complete.</p><p id="save-status" class="status" role="status"></p><div class="done-actions"><button class="button secondary hidden" id="retry" type="button">Try saving again</button><button class="button secondary" id="download" type="button">Download your answers</button></div></section>
</main>
<script>
'use strict';
// Set this to the deployed Apps Script URL after setup.
const RESULTS_ENDPOINT = '';
const STORAGE_KEY = 'btu-risk-experiment-v3';
const FIELDS = ['coin_fee','insurance','petersburg_thousands','petersburg_max','ce_40','ce_50','allais_1','allais_2','ellsberg_1','ellsberg_2'];
const questions = [
 {title:'A coin toss',body:'A fair coin is tossed. If it lands heads, you receive €100. If it lands tails, you receive nothing.',fields:[{name:'coin_fee',prompt:'What is the most you would pay to play?',type:'money'}]},
 {title:'Your laptop',body:'Your laptop has a 1% chance of needing a €1,000 repair. Otherwise, there is no repair cost.',fields:[{name:'insurance',prompt:'What would you choose?',options:[['insured','Pay €11 for insurance that covers the full repair cost.'],['uninsured','Do not buy insurance; pay for the repair if needed.']]}]},
 {title:'A different coin game',body:'A fair coin is tossed until it first lands heads. You receive €2 if this happens on the first toss, €4 on the second, €8 on the third, and so on. The payout doubles with each toss until the first heads.',fields:[{name:'petersburg_thousands',prompt:'Would you pay thousands of euros to play?',options:[['yes','Yes'],['no','No'],['unsure','Not sure']]},{name:'petersburg_max',prompt:'What is the most you would pay to play?',type:'money'}]},
 {title:'A gamble or a sure amount',body:'The gamble pays €100 if a fair coin lands heads and €0 if it lands tails. For each choice, you receive either the gamble or the sure amount, not both.',fields:[{name:'ce_40',prompt:'Which do you prefer?',options:[['gamble','The coin-toss gamble'],['sure','€40 for certain'],['indifferent','I value them equally']]},{name:'ce_50',prompt:'And which do you prefer here?',options:[['gamble','The coin-toss gamble'],['sure','€50 for certain'],['indifferent','I value them equally']]}]},
 {title:'Two choices',body:'',fields:[{name:'allais_1',prompt:'First choice',options:[['A','€100 million for certain.'],['B','89% chance of €100 million, 1% chance of €0, and 10% chance of €500 million.'],['indifferent','I value them equally.']]},{name:'allais_2',prompt:'Second choice',options:[['A','11% chance of €100 million and 89% chance of €0.'],['B','10% chance of €500 million and 90% chance of €0.'],['indifferent','I value them equally.']]}]},
 {title:'Bets on an urn',body:'An urn contains 90 balls: 30 are red. The remaining 60 are black or yellow, in unknown proportions. One ball will be drawn. In each bet, you win $100 if the specified color is drawn; otherwise, you win nothing.',fields:[{name:'ellsberg_1',prompt:'First choice',options:[['red','Bet on red'],['black','Bet on black'],['indifferent','I value them equally']]},{name:'ellsberg_2',prompt:'Second choice, using the same urn',options:[['red_yellow','Bet on red or yellow'],['black_yellow','Bet on black or yellow'],['indifferent','I value them equally']]}]}
];
const $=id=>document.getElementById(id);
function fresh(){return {id:(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():'s'+Date.now().toString(36)+Math.random().toString(36).slice(2)),page:0,answers:{},finished:false,saved:false,submittedAt:''}}
let state;try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))||fresh()}catch(e){state=fresh()}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fieldHtml(f){let answer=state.answers[f.name]??'';if(f.type==='money')return `<fieldset><legend><label for="${f.name}">${f.prompt}</label></legend><div class="money"><span>€</span><input id="${f.name}" name="${f.name}" type="number" inputmode="decimal" min="0" step="0.01" value="${escapeHtml(answer)}" required></div><p class="help">Enter 0 if you would not pay.</p></fieldset>`;return `<fieldset><legend>${f.prompt}</legend>${f.options.map(([value,label])=>`<label class="choice"><input type="radio" name="${f.name}" value="${value}" ${answer===value?'checked':''} required><span>${label}</span></label>`).join('')}</fieldset>`}
function render(){if(state.finished){$('work').classList.add('hidden');$('done').classList.remove('hidden');showStatus();return}const q=questions[state.page];$('progress-text').textContent='Decision '+(state.page+1)+' of '+questions.length;$('progress-number').textContent=Math.round(state.page/questions.length*100)+'%';$('progress-bar').style.width=(state.page/questions.length*100)+'%';$('content').innerHTML=`<h2>${q.title}</h2>${q.body?`<p class="lead">${q.body}</p>`:''}${q.fields.map(fieldHtml).join('')}`;$('back').classList.toggle('hidden',state.page===0);$('next').textContent=state.page===questions.length-1?'Finish':'Continue';$('error').textContent='';window.scrollTo(0,0)}
function collect(){const q=questions[state.page];for(const f of q.fields){const input=document.querySelector(`[name="${f.name}"]${f.type==='money'?'':':checked'}`);if(!input||input.value===''||(f.type==='money'&&(!Number.isFinite(Number(input.value))||Number(input.value)<0||Number(input.value)>1e12))){$('error').textContent='Please answer each question before continuing.';if(input)input.focus();return false}state.answers[f.name]=f.type==='money'?Number(input.value):input.value}return true}
$('form').addEventListener('submit',e=>{e.preventDefault();if(!collect())return;if(state.page<questions.length-1){state.page++;persist();render()}else{state.finished=true;state.submittedAt=new Date().toISOString();persist();render();send()}});
$('back').addEventListener('click',()=>{const q=questions[state.page];for(const f of q.fields){const input=document.querySelector(`[name="${f.name}"]${f.type==='money'?'':':checked'}`);if(input&&input.value!=='')state.answers[f.name]=input.value}state.page--;persist();render()});
function showStatus(message){$('save-status').textContent=message||(state.saved?'Your answers have been saved.':RESULTS_ENDPOINT?'Saving your answers…':'Download your answers and share the file with your lecturer.');$('retry').classList.toggle('hidden',!RESULTS_ENDPOINT||state.saved)}
function send(){if(!RESULTS_ENDPOINT||state.saved)return;showStatus('Saving your answers…');$('retry').disabled=true;const callback='riskReply_'+Math.random().toString(36).slice(2),script=document.createElement('script'),url=new URL(RESULTS_ENDPOINT);let settled=false;const finish=(ok)=>{if(settled)return;settled=true;clearTimeout(timer);delete window[callback];script.remove();$('retry').disabled=false;if(ok){state.saved=true;persist();showStatus()}else showStatus('Could not save. Try again, or download your answers.');};window[callback]=reply=>finish(Boolean(reply&&reply.ok));url.searchParams.set('callback',callback);url.searchParams.set('payload',JSON.stringify({id:state.id,submittedAt:state.submittedAt,answers:state.answers}));script.src=url.toString();script.onerror=()=>finish(false);const timer=setTimeout(()=>finish(false),15000);document.head.appendChild(script)}
$('retry').addEventListener('click',send);
function csvCell(x){let v=String(x??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
$('download').addEventListener('click',()=>{const columns=['id','submittedAt',...FIELDS],values=[state.id,state.submittedAt,...FIELDS.map(f=>state.answers[f])],csv=columns.map(csvCell).join(',')+'\r\n'+values.map(csvCell).join(',')+'\r\n',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='choices-'+state.id.slice(0,8)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
render();if(state.finished&&!state.saved&&RESULTS_ENDPOINT)send();
</script></body></html>
